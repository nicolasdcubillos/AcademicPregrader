<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Academic Pregrader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --bg: #0b0c12; --surface: #14151d; --border: #262838; --border-focus: #5a67d6;
      --p1: #5a67d6; --p2: #7c74d8; --text: #e8eaf3; --text-2: #a0a5ba; --text-3: #5c6178;
      --red: #f87171; --red-dim: rgba(248,113,113,.12);
      --input-bg: #191b24; --glow1: rgba(90,103,214,.30); --glow2: rgba(124,116,216,.22);
      --font: 'Inter', system-ui, sans-serif; --r: 16px; --r-sm: 10px;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6fa; --surface: #ffffff; --border: #e4e7f0; --border-focus: #4b58c9;
      --p1: #4b58c9; --p2: #6f66cf; --text: #1b2030; --text-2: #545b71; --text-3: #878da2;
      --red: #dc2626; --red-dim: rgba(220,38,38,.08);
      --input-bg: #f5f6fb; --glow1: rgba(75,88,201,.12); --glow2: rgba(111,102,207,.10);
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; overflow: hidden; position: relative;
    }
    body::before {
      content: ''; position: fixed; width: 700px; height: 600px; top: -180px; left: -120px;
      background: radial-gradient(circle, var(--glow1) 0%, transparent 70%);
      border-radius: 50%; filter: blur(130px); opacity: .8; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; width: 600px; height: 500px; bottom: -160px; right: -150px;
      background: radial-gradient(circle, var(--glow2) 0%, transparent 70%);
      border-radius: 50%; filter: blur(130px); opacity: .8; pointer-events: none;
    }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 380px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .brand {
      width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 14px;
      background: linear-gradient(135deg, #4b58c9, #6f66cf);
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 6px 18px rgba(75,88,201,.25);
    }
    .brand svg { width: 26px; height: 26px; }
    .theme-toggle {
      position: fixed; top: 16px; right: 16px; z-index: 5; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
      color: var(--text-2); cursor: pointer; transition: border-color .18s, color .18s;
    }
    .theme-toggle:hover { border-color: var(--p1); color: var(--p1); }
    .theme-toggle .ic-moon { display: none; }
    .theme-toggle .ic-sun  { display: block; }
    html[data-theme="light"] .theme-toggle .ic-sun  { display: none; }
    html[data-theme="light"] .theme-toggle .ic-moon { display: block; }
    h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .sub { font-size: 13px; color: var(--text-2); text-align: center; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    input {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: var(--r-sm); color: var(--text); font-family: var(--font);
      font-size: 14px; padding: 11px 13px; margin-bottom: 18px; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--border-focus); }
    button {
      width: 100%; border: none; cursor: pointer; color: #fff; font-weight: 600;
      font-size: 14px; padding: 12px; border-radius: var(--r-sm);
      background: linear-gradient(135deg, var(--p1), var(--p2));
      transition: opacity .15s;
    }
    button:hover { opacity: .92; }
    .error {
      background: var(--red-dim); border: 1px solid rgba(248,113,113,.3);
      color: var(--red); font-size: 13px; padding: 10px 12px;
      border-radius: var(--r-sm); margin-bottom: 20px; text-align: center;
    }
    .foot {
      position: relative; z-index: 1; text-align: center; margin-top: 20px;
      font-size: 11px; color: var(--text-3); letter-spacing: .02em; line-height: 1.6;
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">
    <svg class="ic-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="ic-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div class="card">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg></div>
    <h1>Academic Pregrader</h1>
    <div class="sub">Herramienta de pre-calificación académica — inicia sesión para continuar</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next_url }}" />
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Entrar</button>
    </form>
  </div>
  <div class="foot">© 2026 Nicolás D. — Todos los derechos reservados</div>
  <script>
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    }
  </script>
</body>
</html>
