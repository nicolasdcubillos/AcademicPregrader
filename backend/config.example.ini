[steps]
enable_compilation = true
enable_plagiarism = true
enable_llm = true
enable_cache = false

[paths]
# Path to the JPlag jar inside the container image
jplag_jar = /app/backend/jplag-6.3.0-jar-with-dependencies.jar

[llm]
provider = openai
model = gpt-5-mini
openai_enabled = true
gemini_enabled = true
# Do NOT commit real keys. Set them at runtime via the app's config UI
# for local use. In Azure, inject OPENAI_API_KEY or GEMINI_API_KEY from Key Vault.
gemini_api_key =
openai_api_key =

[plagiarism]
threshold = 0.7

[performance]
max_workers = 4
