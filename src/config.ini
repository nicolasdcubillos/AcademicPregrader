# =====================================================================
# AcademicPregrader - Configuración
# =====================================================================

[steps]
# Activar o desactivar cada etapa del flujo de evaluación (true/false)
enable_compilation = true
enable_plagiarism  = false
enable_llm         = true

[paths]
# Ruta absoluta al JAR de JPlag v4+ (necesario solo si enable_plagiarism=true)
# Descarga: https://github.com/jplag/JPlag/releases
jplag_jar = /ruta/a/jplag.jar

[llm]
# Comando CLI del LLM (por defecto: ollama)
command = ollama
# Nombre del modelo a usar
model   = llama3

[plagiarism]
# Umbral de similitud para marcar plagio (0.0 a 1.0)
# Ejemplo: 0.7 = 70% de similitud
threshold = 0.7